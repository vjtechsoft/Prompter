
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F1C18" />
      <stop offset="50%" stop-color="#2A2722" />
      <stop offset="100%" stop-color="#141310" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE59F" />
      <stop offset="45%" stop-color="#E8C15F" />
      <stop offset="100%" stop-color="#B38928" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="256" y1="120" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0D27A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E8C15F" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="114" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Subtle glow disk -->
  <circle cx="256" cy="220" r="160" fill="url(#glowGrad)" />

  <!-- Stylized Prompter Emblem: Elegant Aperture / Deck Card & 'P' -->
  <g filter="url(#shadow)">
    <!-- Base card shape -->
    <rect x="140" y="110" width="232" height="292" rx="28" fill="#181613" stroke="url(#goldGrad)" stroke-width="6" />
    
    <!-- Camera Aperture / Sparkle overlay -->
    <path d="M256 160 L266 210 L316 220 L266 230 L256 280 L246 230 L196 220 L246 210 Z" fill="url(#goldGrad)" />
    
    <!-- Stylized Modern Letter P loop -->
    <path d="M190 170 H270 C305 170 330 195 330 230 C330 265 305 290 270 290 H230 V350 H190 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
